<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bills Pro | Tra Cứu Học Phí HUFLIT</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-hover-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --primary-gradient: linear-gradient(45deg, #0d6efd, #0dcaf0);
        }

        body {
            background: url('https://e-bills.vn/assets/merchant/huflit/themedefault/home/imgs/bg.jpg') center/cover fixed, #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .glass-overlay {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: -1;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            color: white;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: var(--glass-hover-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.4) !important;
            border-color: #0dcaf0 !important;
            background: rgba(0, 0, 0, 0.6) !important;
        }

        .glass-input::placeholder { 
            color: rgba(255, 255, 255, 0.5); 
            text-transform: none;
        }

        .btn-glow {
            background: var(--primary-gradient);
            border: none;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-glow:hover { 
            box-shadow: 0 0 20px rgba(13, 202, 240, 0.6); 
            color: white;
            transform: translateY(-2px);
        }

        .badge-paid { 
            background-color: rgba(16, 185, 129, 0.2); 
            color: #34d399; 
            border: 1px solid #10b981;
        }

        .badge-pending { 
            background-color: rgba(239, 68, 68, 0.2); 
            color: #f87171; 
            border: 1px solid #ef4444;
        }
        
        .table-dark {
            --bs-table-bg: transparent;
            --bs-table-color: #fff;
        }

        .table-hover tbody tr:hover { 
            background-color: rgba(255, 255, 255, 0.05); 
            color: #fff; 
        }

        .table-secondary { 
            --bs-table-bg: rgba(255, 255, 255, 0.1); 
            color: #fff; 
            border-bottom: 2px solid rgba(255, 255, 255, 0.2); 
        }

        .payment-meta {
            color: rgba(255, 255, 255, 0.72);
        }

        .payment-amount {
            color: #f87171;
            font-size: clamp(1.9rem, 4vw, 2.45rem);
            letter-spacing: -0.5px;
        }

        .transfer-box {
            background: rgba(2, 6, 23, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.38);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transfer-content {
            flex: 1;
            min-width: 0;
            color: #22d3ee;
            font-weight: 700;
            font-family: Consolas, "Courier New", monospace;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        .copy-payment-btn {
            flex: 0 0 auto;
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 10px;
            background: rgba(34, 211, 238, 0.12);
            color: #22d3ee;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .copy-payment-btn:hover {
            background: rgba(34, 211, 238, 0.22);
            transform: translateY(-1px);
        }

        .qr-shell {
            display: inline-block;
            background: #fff;
            padding: 10px;
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        .qr-shell img {
            display: block;
            width: min(100%, 260px);
            border-radius: 12px;
        }

        .payment-note {
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(15, 23, 42, 0.38);
            border-radius: 10px;
            padding: 10px 12px;
            color: rgba(255, 255, 255, 0.62);
            font-size: 0.82rem;
        }

        /* Utility transition classes */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .container {
                padding-top: 1.5rem !important;
                padding-bottom: 1.5rem !important;
            }

            .text-center.mb-5 {
                margin-bottom: 1.75rem !important;
            }

            .text-center.mb-5 img {
                height: 60px;
            }

            .text-center.mb-5 h1 {
                font-size: clamp(1.7rem, 8vw, 2.4rem);
                letter-spacing: 1px !important;
                line-height: 1.15;
            }

            .text-center.mb-5 p {
                font-size: 0.95rem;
            }

            .glass-card {
                padding: 18px;
                border-radius: 14px;
            }

            #searchSection {
                max-width: 100% !important;
            }

            #resultSection .col-lg-5,
            #resultSection .col-lg-7,
            #resultSection .col-12 {
                padding-left: 8px;
                padding-right: 8px;
            }

            #st-name {
                font-size: 1rem !important;
                text-align: right;
                max-width: 65%;
            }

            #st-faculty {
                max-width: 65%;
            }

            .table-responsive {
                border-radius: 12px;
            }

            .table th,
            .table td {
                white-space: nowrap;
                font-size: 0.9rem;
            }

            .transfer-box {
                align-items: flex-start;
            }

            .qr-shell img {
                width: min(100%, 235px);
            }
        }

    </style>
</head>
<body>
    <div class="glass-overlay"></div>
    
    <div class="container py-5 content-wrapper position-relative">
        <!-- Header -->
        <div class="text-center mb-5">
            <img src="https://e-bills.vn/assets/merchant/huflit/themedefault/home/imgs/Logo.png" alt="HUFLIT Logo" height="80" class="mb-3 drop-shadow">
            <h1 class="fw-bold text-white text-uppercase" style="letter-spacing: 2px;">Cổng Thanh Toán Trực Tuyến</h1>
            <p class="text-light opacity-75">Trang cá nhân để tra cứu trạng thái học phí</p>
            
        </div>

        <!-- Section 1: Search Form -->
        <div id="searchSection" class="glass-card mx-auto fade-in" style="max-width: 500px;">
            <form id="searchForm">
                <div class="mb-4">
                    <label for="mssvInput" class="form-label text-light fw-semibold">Nhập Mã Sinh Viên</label>
                    <input type="text" id="mssvInput" class="form-control form-control-lg glass-input text-center fw-bold" placeholder="Mã sinh viên" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-lg w-100 fw-bold btn-glow" id="btnSearch">
                    <i class="fa-solid fa-magnifying-glass me-2"></i> TRA CỨU
                </button>
            </form>
        </div>

        <!-- Section 2: Dashboard Results (Hidden by default) -->
        <div id="resultSection" class="row mt-4" style="display: none;">
            <!-- Back Button -->
            <div class="col-12 mb-3">
                <button onclick="backToSearch()" class="btn btn-outline-light btn-sm rounded-pill px-3 transition-all hover-scale">
                    <i class="fa-solid fa-arrow-left me-1"></i> Quay lại tìm kiếm
                </button>
            </div>

            <!-- Left Column: Student Info -->
            <div class="col-lg-5 mb-4">
                <div class="glass-card h-100">
                    <h4 class="border-bottom border-secondary pb-2 mb-4 text-white">
                        <i class="fa-solid fa-user-graduate text-info me-2"></i> Thông Tin Sinh Viên
                    </h4>
                    <div class="d-flex justify-content-between mb-3 border-bottom border-secondary pb-2">
                        <span class="text-light opacity-75">MSSV:</span> 
                        <span id="st-mssv" class="fw-bold text-white font-monospace fs-5"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 border-bottom border-secondary pb-2">
                        <span class="text-light opacity-75">Họ Tên:</span> 
                        <span id="st-name" class="fw-bold text-warning text-uppercase fs-5"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 border-bottom border-secondary pb-2">
                        <span class="text-light opacity-75">Khóa/Ngành:</span> 
                        <span id="st-faculty" class="fw-bold text-white text-end"></span>
                    </div>
                </div>
            </div>
            
            <!-- Right Column: Payment & QR -->
            <div class="col-lg-7 mb-4">
                <div class="glass-card h-100">
                    <h4 class="border-bottom border-secondary pb-2 mb-4 text-white">
                        <i class="fa-solid fa-qrcode text-info me-2"></i> Thông Tin Chuyển Khoản
                    </h4>
                    <div id="payment-zone" class="fade-in">
                        <!-- Injected via JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Bottom Table: Invoice History -->
            <div class="col-12">
                <div class="glass-card">
                    <h4 class="mb-4 text-white">
                        <i class="fa-solid fa-file-invoice-dollar text-info me-2"></i> Mã Hóa Đơn
                    </h4>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover table-borderless text-center align-middle m-0">
                            <thead class="table-secondary">
                                <tr>
                                    <th class="py-3">Mã Hóa Đơn</th>
                                    <th class="py-3 text-start">Nội Dung Thu</th>
                                    <th class="py-3">Tổng Tiền (VNĐ)</th>
                                    <th class="py-3">Hạn Chót</th>
                                    <th class="py-3">Trạng Thái</th>
                                </tr>
                            </thead>
                            <tbody id="invoiceList">
                                <!-- Injected via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main JavaScript Logic -->
    <script>
        // --- 1. DATA LAYER ---
const initialDB = {
            "25DH740559": {
                student: {
                    mssv: "25DH740559",
                    full_name: "TRẦN THÀNH TÀI",
                    faculty: "Khoa Ngoại ngữ (Ngôn ngữ Trung Quốc)",
                    cohort: "K25"
                },
                invoices: [
                    {
                        invoice_code: "6839201834",
                        title: "Học phí",
                        semester: "HK01",
                        academic_year: "2026-2027",
                        amount: 18450000,
                        status: "PAID",
                        due_date: "31/08/2026"
                    },
                    {
                        invoice_code: "5868803743",
                        title: "Học phí",
                        semester: "HK02",
                        academic_year: "2026-2027",
                        amount: 20910000,
                        status: "PENDING",
                        due_date: "24/12/2026"
                    },
                    {
                        invoice_code: "5868803743",
                        title: "Học phí",
                        semester: "HK02",
                        academic_year: "2025-2026",
                        amount: 20910000,
                        status: "PAID",
                        due_date: "24/12/2025"
                    }
                ]
            }
        };

        let db = JSON.parse(JSON.stringify(initialDB));

        // --- 2. TIỆN ÍCH (Utilities) ---
        const formatVND = (amount) => new Intl.NumberFormat('vi-VN').format(amount) + ' VNĐ';

        const BANK_CONFIG = {
            bankId: "MB",
            accountNo: "0931441536",
            accountName: "NGUYEN THANH NGAN"
        };

        const removeAccents = (str) => str
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd')
            .replace(/Đ/g, 'D');

        const copyToClipboard = async (value) => {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(value);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = value;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    textarea.remove();
                }

                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'Đã sao chép nội dung chuyển khoản',
                    showConfirmButton: false,
                    timer: 1800,
                    background: '#1e293b',
                    color: '#fff'
                });
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Không thể sao chép',
                    text: 'Bạn hãy nhấn giữ để sao chép nội dung chuyển khoản.',
                    background: '#1e293b',
                    color: '#fff'
                });
            }
        };
        // --- 3. LOGIC HIỂN THỊ & XỬ LÝ (Core Logic) ---

        document.addEventListener('DOMContentLoaded', () => {
            const searchForm = document.getElementById('searchForm');
            const mssvInput = document.getElementById('mssvInput');
            const btnSearch = document.getElementById('btnSearch');
            const searchSection = document.getElementById('searchSection');
            const resultSection = document.getElementById('resultSection');

            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const mssv = mssvInput.value.trim().toUpperCase();
                
                btnSearch.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> ĐANG TÌM KIẾM...';
                btnSearch.disabled = true;

                setTimeout(() => {
                    if (db[mssv]) {
                        renderDashboard(db[mssv]);
                        searchSection.style.display = 'none';
                        resultSection.classList.add('fade-in');
                        resultSection.style.display = 'flex';
                    } else {
                        Swal.fire({
                            icon: 'error', title: 'Không tìm thấy!', text: 'Mã sinh viên không tồn tại trong hệ thống.',
                            background: '#1e293b', color: '#fff', confirmButtonColor: '#3b82f6'
                        });
                    }
                    btnSearch.innerHTML = '<i class="fa-solid fa-magnifying-glass me-2"></i> TRA CỨU';
                    btnSearch.disabled = false;
                }, 800);
            });
        });

        // Render Giao diện
        const renderDashboard = (data) => {
            const { student, invoices } = data;
            
            document.getElementById('st-mssv').textContent = student.mssv;
            document.getElementById('st-name').textContent = student.full_name;
            document.getElementById('st-faculty').innerHTML = `${student.cohort} <br> <small class="text-info">${student.faculty}</small>`;

            const pendingInv = invoices.find(inv => inv.status === 'PENDING');
            const paymentZone = document.getElementById('payment-zone');

            if (!pendingInv) {
                paymentZone.innerHTML = `
                    <div class="text-center py-5 fade-in">
                        <i class="fa-solid fa-circle-check text-success mb-3" style="font-size: 60px; filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.5));"></i>
                        <h4 class="text-white fw-bold">Hoàn Tất Thanh Toán!</h4>
                        <p class="text-light opacity-75 mt-2 mb-0">Không có khoản học phí nào đang chờ thanh toán.</p>
                    </div>
                `;
                renderTable(invoices);
                return;
            }

            const transferContent = `EB ${student.mssv} ${removeAccents(student.full_name).toUpperCase()} THANH TOAN`;
            const qrUrl = `https://img.vietqr.io/image/${BANK_CONFIG.bankId}-${BANK_CONFIG.accountNo}-compact2.png?amount=${pendingInv.amount}&addInfo=${encodeURIComponent(transferContent)}&accountName=${encodeURIComponent(BANK_CONFIG.accountName)}`;

            paymentZone.innerHTML = `
                <div class="row align-items-center g-4 fade-in">
                    <div class="col-md-7 text-start">
                        <p class="payment-meta mb-1">Mã đơn: <b class="text-white font-monospace">${pendingInv.invoice_code}</b></p>
                        <p class="payment-meta mb-1 mt-3">Số tiền thanh toán:</p>
                        <div class="payment-amount fw-bold mb-3">${formatVND(pendingInv.amount)}</div>

                        <p class="payment-meta mb-2">Nội dung chuyển khoản <span class="text-warning">(Bắt buộc)</span>:</p>
                        <div class="transfer-box mb-3">
                            <div class="transfer-content">${transferContent}</div>
                            <button
                                type="button"
                                class="copy-payment-btn"
                                onclick="copyToClipboard(this.dataset.copy)"
                                data-copy="${transferContent}"
                                aria-label="Sao chép nội dung chuyển khoản"
                                title="Sao chép"
                            >
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>

                        <div class="payment-note">
                            Đây là thông tin chuyển khoản cá nhân được cấu hình trên trang này, không phải cổng thanh toán chính thức của HUFLIT hoặc E-BILLS.
                        </div>
                    </div>

                    <div class="col-md-5 text-center">
                        <div class="qr-shell">
                            <img src="${qrUrl}" alt="Mã QR VietQR thanh toán">
                        </div>
                        <div class="mt-3 text-light opacity-75 small">
                            ${pendingInv.semester} · ${pendingInv.academic_year} · Hạn ${pendingInv.due_date}
                        </div>
                    </div>
                </div>
            `;

            renderTable(invoices);
        };

        // Vẽ Bảng Mã Hóa Đơn
        const renderTable = (invoices) => {
            const tbody = document.getElementById('invoiceList');
            tbody.innerHTML = '';
            
            invoices.forEach(inv => {
                const isPaid = inv.status === 'PAID';
                const badge = isPaid 
                    ? `<span class="badge badge-paid px-3 py-2 rounded-pill"><i class="fa-solid fa-check-circle me-1"></i> ĐÃ THANH TOÁN</span>`
                    : `<span class="badge badge-pending px-3 py-2 rounded-pill"><i class="fa-solid fa-clock me-1"></i> CHỜ THANH TOÁN</span>`;
                
                tbody.innerHTML += `
                    <tr>
                        <td class="font-monospace text-light">${inv.invoice_code}</td>
                        <td class="text-start">
                            <b class="text-white">${inv.title}</b><br>
                            <small class="text-info">${inv.semester} (${inv.academic_year})</small>
                        </td>
                        <td class="fw-bold ${isPaid ? 'text-success' : 'text-danger'}">${formatVND(inv.amount)}</td>
                        <td class="text-light opacity-75">${inv.due_date}</td>
                        <td>${badge}</td>
                    </tr>
                `;
            });
        };

        // Nút Quay lại
        window.backToSearch = () => {
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('searchSection').style.display = 'block';
            document.getElementById('mssvInput').value = '';
            db = JSON.parse(JSON.stringify(initialDB));
        };
    </script>
</body>
</html>
